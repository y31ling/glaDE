<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Nominal total loss versus the physical image-4 magnification penalty for three historical false solutions</title>
  <desc id="desc">A logarithmic bar chart comparing the nominal total optimizer loss with the image-4 magnification chi-square term alone after replacing a single root by the total absolute magnification of the unresolved cluster.</desc>
  <defs>
    <style>
      .bg{fill:#0b1220}.panel{fill:#111c2e;stroke:#334155;stroke-width:2}.t{fill:#e5e7eb;font-family:'Noto Sans CJK SC','Noto Sans CJK TC',Arial,'Noto Sans',sans-serif}.muted{fill:#9ca3af;font-family:'Noto Sans CJK SC','Noto Sans CJK TC',Arial,'Noto Sans',sans-serif}.grid{stroke:#334155;stroke-width:1}.nom{fill:#60a5fa}.phy{fill:#fb7185}.axis{stroke:#94a3b8;stroke-width:2}
    </style>
  </defs>
  <rect width="1000" height="620" class="bg"/>
  <text x="40" y="48" class="t" font-size="28" font-weight="700">One physical flux term already dwarfs the nominal total loss</text>
  <text x="40" y="79" class="t" font-size="21">很低的名义 loss 可以掩盖灾难性的总流量失配</text>
  <rect x="40" y="105" width="920" height="455" rx="16" class="panel"/>

  <!-- log axis y=500-95 for 0.1..2000 -->
  <line x1="125" y1="500" x2="920" y2="500" class="axis"/>
  <line x1="125" y1="95" x2="125" y2="500" class="axis"/>
  <g class="grid">
    <line x1="125" y1="500" x2="920" y2="500"/><line x1="125" y1="406" x2="920" y2="406"/><line x1="125" y1="312" x2="920" y2="312"/><line x1="125" y1="218" x2="920" y2="218"/><line x1="125" y1="124" x2="920" y2="124"/>
  </g>
  <g class="muted" font-size="14" text-anchor="end">
    <text x="112" y="505">0.1</text><text x="112" y="411">1</text><text x="112" y="317">10</text><text x="112" y="223">100</text><text x="112" y="129">1000</text>
  </g>
  <text x="72" y="305" class="t" font-size="16" text-anchor="middle" transform="rotate(-90 72 305)">loss (log scale / 对数轴)</text>

  <!-- values mapped y = 500 - 94*log10(v/0.1) -->
  <rect x="205" y="310" width="62" height="190" rx="5" class="nom"/>
  <rect x="273" y="114" width="62" height="386" rx="5" class="phy"/>
  <text x="236" y="300" class="t" text-anchor="middle" font-size="15">10.71</text><text x="304" y="104" class="t" text-anchor="middle" font-size="15">≈853</text>

  <rect x="445" y="496" width="62" height="4" rx="2" class="nom"/>
  <rect x="513" y="120" width="62" height="380" rx="5" class="phy"/>
  <text x="476" y="484" class="t" text-anchor="middle" font-size="15">0.11</text><text x="544" y="110" class="t" text-anchor="middle" font-size="15">≈735</text>

  <rect x="685" y="278" width="62" height="222" rx="5" class="nom"/>
  <rect x="753" y="90" width="62" height="410" rx="5" class="phy"/>
  <text x="716" y="268" class="t" text-anchor="middle" font-size="15">23.2</text><text x="784" y="82" class="t" text-anchor="middle" font-size="15">≈1091</text>

  <g class="t" font-size="16" text-anchor="middle">
    <text x="270" y="532">NFW + point</text><text x="510" y="532">SIE + point</text><text x="750" y="532">SIE + King</text>
  </g>
  <rect x="315" y="564" width="20" height="16" class="nom"/><text x="345" y="578" class="t" font-size="14">nominal total loss / 名义总 loss</text>
  <rect x="315" y="590" width="20" height="16" class="phy"/><text x="345" y="604" class="t" font-size="14">physical img4 χ² / 第4像物理光度项</text>
</svg>
