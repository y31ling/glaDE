<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Where amoeba and GLADE DE share the micro-image blind spot</title>
  <desc id="desc">Data-flow diagram showing native amoeba image-plane and source-plane objectives, GLADE DE CPU and GPU objectives, the incomplete-root guard, and the current auto-check detour.</desc>
  <defs>
    <style>
      .bg{fill:#0b1220}.box{fill:#162238;stroke:#475569;stroke-width:2}.warn{fill:#3a2028;stroke:#fb7185;stroke-width:2}.ok{fill:#163228;stroke:#4ade80;stroke-width:2}.guard{fill:#342d19;stroke:#fbbf24;stroke-width:2}.t{fill:#e5e7eb;font-family:'Noto Sans CJK SC','Noto Sans CJK TC',Arial,'Noto Sans',sans-serif}.muted{fill:#a3adc0;font-family:'Noto Sans CJK SC','Noto Sans CJK TC',Arial,'Noto Sans',sans-serif}.code{fill:#c4b5fd;font-family:'DejaVu Sans Mono',monospace}.arrow{stroke:#94a3b8;stroke-width:2.5;fill:none}.badarrow{stroke:#fb7185;stroke-width:3;fill:none}.goodarrow{stroke:#4ade80;stroke-width:3;fill:none}
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#fb7185"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4ade80"/></marker>
  </defs>
  <rect width="1200" height="720" class="bg"/>
  <text x="35" y="44" class="t" font-size="27" font-weight="700">The blind spot is in the observable pipeline, not in the optimizer</text>
  <text x="35" y="74" class="t" font-size="20">盲区位于“物理量如何进入 loss”的管线，而不在优化器本身</text>

  <!-- lanes -->
  <text x="28" y="135" class="t" font-size="16" font-weight="700">native amoeba</text>
  <text x="28" y="158" class="muted" font-size="15">原生 amoeba</text>
  <rect x="155" y="105" width="170" height="72" rx="10" class="box"/>
  <text x="240" y="134" class="t" text-anchor="middle" font-size="16">image-plane χ²</text><text x="240" y="158" class="muted" text-anchor="middle" font-size="14">像平面路径</text>
  <rect x="365" y="105" width="210" height="72" rx="10" class="warn"/>
  <text x="470" y="132" class="t" text-anchor="middle" font-size="16">glafic adaptive finder</text><text x="470" y="156" class="code" text-anchor="middle" font-size="14">dp_min = 12.5 mas</text>
  <path d="M325 141 H365" class="arrow" marker-end="url(#a)"/>

  <rect x="155" y="200" width="170" height="72" rx="10" class="box"/>
  <text x="240" y="229" class="t" text-anchor="middle" font-size="16">source-plane χ²</text><text x="240" y="253" class="muted" text-anchor="middle" font-size="14">源平面路径</text>
  <rect x="365" y="200" width="210" height="72" rx="10" class="warn"/>
  <text x="470" y="226" class="t" text-anchor="middle" font-size="16">local Jacobian only</text><text x="470" y="250" class="muted" text-anchor="middle" font-size="14">不枚举任何根</text>
  <path d="M325 236 H365" class="arrow" marker-end="url(#a)"/>

  <text x="28" y="347" class="t" font-size="18" font-weight="700">GLADE DE</text>
  <text x="28" y="370" class="muted" font-size="15">点源路径</text>
  <rect x="155" y="312" width="170" height="72" rx="10" class="box"/>
  <text x="240" y="341" class="t" text-anchor="middle" font-size="16">CPU objective</text><text x="240" y="365" class="muted" text-anchor="middle" font-size="14">glafic binding</text>
  <rect x="365" y="312" width="210" height="72" rx="10" class="warn"/>
  <text x="470" y="340" class="t" text-anchor="middle" font-size="16">same C finder</text><text x="470" y="364" class="code" text-anchor="middle" font-size="14">dp_min = 12.5 mas</text>
  <path d="M325 348 H365" class="arrow" marker-end="url(#a)"/>

  <rect x="155" y="407" width="170" height="72" rx="10" class="box"/>
  <text x="240" y="436" class="t" text-anchor="middle" font-size="16">GPU objective</text><text x="240" y="460" class="muted" text-anchor="middle" font-size="14">Rhongomyniad</text>
  <rect x="365" y="407" width="210" height="72" rx="10" class="warn"/>
  <text x="470" y="435" class="t" text-anchor="middle" font-size="16">triangle seed grid</text><text x="470" y="459" class="code" text-anchor="middle" font-size="14">dp = 12.5 mas</text>
  <path d="M325 443 H365" class="arrow" marker-end="url(#a)"/>

  <!-- merge -->
  <rect x="630" y="196" width="190" height="192" rx="14" class="warn"/>
  <text x="725" y="226" class="t" text-anchor="middle" font-size="18" font-weight="700">one scored branch</text>
  <text x="725" y="251" class="muted" text-anchor="middle" font-size="15">只给一条像分支打分</text>
  <text x="725" y="291" class="code" text-anchor="middle" font-size="18">one μ = −9.09</text>
  <text x="725" y="325" class="muted" text-anchor="middle" font-size="15">companions absent</text>
  <text x="725" y="348" class="muted" text-anchor="middle" font-size="15">伴根未报告或未枚举</text>
  <path d="M575 141 C610 141 600 235 630 235" class="badarrow" marker-end="url(#r)"/>
  <path d="M575 236 H630" class="badarrow" marker-end="url(#r)"/>
  <path d="M575 348 C610 348 600 330 630 330" class="badarrow" marker-end="url(#r)"/>
  <path d="M575 443 C615 443 600 365 630 365" class="badarrow" marker-end="url(#r)"/>

  <rect x="630" y="420" width="190" height="105" rx="12" class="guard"/>
  <text x="725" y="451" class="t" text-anchor="middle" font-size="16">image-count / parity</text>
  <text x="725" y="476" class="muted" text-anchor="middle" font-size="14">不能汇总伴根流量</text>
  <text x="725" y="499" class="muted" text-anchor="middle" font-size="11">source-plane χ²:</text>
  <text x="725" y="516" class="muted" text-anchor="middle" font-size="11">image count unavailable</text>
  <path d="M725 388 V420" class="arrow" marker-end="url(#a)"/>

  <rect x="875" y="196" width="280" height="128" rx="14" class="warn"/>
  <text x="1015" y="228" class="t" text-anchor="middle" font-size="18" font-weight="700">historical nominal score</text>
  <text x="1015" y="253" class="muted" text-anchor="middle" font-size="15">历史名义打分</text>
  <text x="1015" y="286" class="code" text-anchor="middle" font-size="19">|−9.09| ≈ μ_obs 9.1</text>
  <path d="M820 260 H875" class="badarrow" marker-end="url(#r)"/>

  <!-- auto check -->
  <rect x="365" y="565" width="290" height="110" rx="14" class="ok"/>
  <text x="510" y="597" class="t" text-anchor="middle" font-size="17" font-weight="700">auto_check: local adaptive solve</text>
  <text x="510" y="623" class="muted" text-anchor="middle" font-size="15">局部、自适应尺度、多根求解</text>
  <text x="510" y="651" class="code" text-anchor="middle" font-size="17">θ_scale → {μ₁, μ₂, …}</text>
  <rect x="730" y="565" width="210" height="110" rx="14" class="ok"/>
  <text x="835" y="604" class="t" text-anchor="middle" font-size="18">physical observable</text>
  <text x="835" y="631" class="code" text-anchor="middle" font-size="22">Σ |μᵢ| = 41.2</text>
  <path d="M655 620 H730" class="goodarrow" marker-end="url(#g)"/>
  <rect x="982" y="565" width="173" height="110" rx="14" class="ok"/>
  <text x="1068" y="604" class="t" text-anchor="middle" font-size="18">physical loss</text>
  <text x="1068" y="631" class="muted" text-anchor="middle" font-size="15">物理 loss</text>
  <path d="M940 620 H982" class="goodarrow" marker-end="url(#g)"/>
  <path d="M470 479 V565" class="goodarrow" marker-end="url(#g)"/>
  <path d="M470 384 V565" class="goodarrow" marker-end="url(#g)"/>
  <text x="40" y="688" fill="#fb7185" font-family="'Noto Sans CJK SC','Noto Sans CJK TC',Arial,'Noto Sans',sans-serif" font-size="15">Current boundary / 当前边界：point-source GLADE DE/MCMC are wired to auto_check; standalone native amoeba is not.</text>
</svg>
